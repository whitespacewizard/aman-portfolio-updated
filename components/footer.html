  <div class="footer-shell">
    <section aria-label="Contact form" class="footer-form-panel">
      <form
        accept-charset="UTF-8"
        action="mailto:amanraj.gtm@gmail.com?subject=New%20website%20contact"
        autocomplete="on"
        class="footer-form"
        enctype="text/plain"
        method="post"
      >
        <div class="footer-form-grid">
          <label class="footer-field" for="footer-full-name">
            <span>Your full name *</span>
            <input
              autocomplete="name"
              id="footer-full-name"
              name="Full name"
              placeholder="John Smith"
              required
              type="text"
            />
          </label>

          <label class="footer-field" for="footer-role">
            <span>Your role *</span>
            <input
              autocomplete="organization-title"
              id="footer-role"
              name="Role"
              placeholder="Founder, Recruiter, Freelancer, etc."
              required
              type="text"
            />
          </label>
        </div>

        <label class="footer-field" for="footer-email">
          <span>Your email address *</span>
          <input
            autocomplete="email"
            id="footer-email"
            name="Email"
            placeholder="mail@example.com"
            required
            type="email"
          />
        </label>

        <fieldset class="footer-status-field">
          <legend>Your status? *</legend>

          <div class="footer-status-options">
            <label for="footer-status-project">
              <input
                autocomplete="off"
                id="footer-status-project"
                name="Status"
                required
                type="radio"
                value="I have a project"
              />
              <span>I have a project</span>
            </label>

            <label for="footer-status-recruiter">
              <input
                autocomplete="off"
                id="footer-status-recruiter"
                name="Status"
                required
                type="radio"
                value="I am a recruiter"
              />
              <span>I am a recruiter</span>
            </label>
          </div>
        </fieldset>

        <label class="footer-field footer-message-field" for="footer-more-info">
          <span>More info *</span>
          <textarea
            id="footer-more-info"
            name="More info"
            placeholder="What’s this about? Project, hiring, or opportunity?"
            required
            rows="4"
          ></textarea>
        </label>

        <button class="footer-submit" type="submit">
          <span>Submit</span>
          <span aria-hidden="true">↗</span>
        </button>
      </form>
    </section>
